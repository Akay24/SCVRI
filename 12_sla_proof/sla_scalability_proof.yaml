# ==============================================================================
# CAPACITY SCALING ROADMAP (BEYOND 500 TENANTS)
# ==============================================================================
scaling_roadmap:
  horizontal_limits:
    kafka_MSK_max_brokers: 30     # MSK supports up to 30 brokers
    citus_max_worker_nodes: 32    # current; can add more
    clickhouse_max_shards: 16     # current 4; 4× growth supported
    eks_max_nodes: 1_000          # AWS EKS limit per cluster
    rds_aurora_global_max_regions: 5

  1000_tenant_scaling:
    total_suppliers: 10_000_000
    kafka_throughput_needed: 200_000   # 2× current
    required_msk_brokers: 12           # scale 6→12 (straightforward)
    required_eks_nodes: "+50% node groups (Karpenter auto)"
    rds_storage: "3.84TB (still < 1% of Aurora max)"
