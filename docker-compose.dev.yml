version: "3.9"

# ============================================================
# SCVRI Platform — Local Development Stack
# ============================================================
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down -v
#
# Services:
#   postgres    - PostgreSQL 15 + Citus (port 5432)
#   redis       - Redis 7 (port 6379)
#   zookeeper   - Kafka Zookeeper (port 2181)
#   kafka       - Kafka (port 9092, external 29092)
#   kafka-ui    - Kafka UI (port 8080)
#   clickhouse  - ClickHouse (ports 8123, 9000)
#   mailhog     - SMTP + Web UI (ports 1025, 8025)
#   minio       - S3-compatible object storage (ports 9001, 9002)
#
# All data stored in named Docker volumes (persists restarts).
# Destroy with: docker compose -f docker-compose.dev.yml down -v

services:
  # ----------------------------------------------------------
  # PostgreSQL 15 + Citus
  # ----------------------------------------------------------
  postgres:
    image: citusdata/citus:12.1
    container_name: scvri_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scvri
      POSTGRES_PASSWORD: scvri_dev_password
      POSTGRES_DB: scvri_db
      # Required for Citus
      PGUSER: scvri
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=citus,pg_stat_statements"
      - "-c"
      - "max_connections=500"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "effective_cache_size=4GB"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "log_statement=ddl"
      - "-c"
      - "log_min_duration_statement=1000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scvri -d scvri_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - scvri_net

  # ----------------------------------------------------------
  # Redis 7
  # ----------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: scvri_redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - redis_dev_password
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev_password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - scvri_net

  # ----------------------------------------------------------
  # Kafka + Zookeeper
  # ----------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: scvri_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scvri_net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: scvri_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - scvri_net

  # ----------------------------------------------------------
  # Kafka topics initialiser (one-shot)
  # ----------------------------------------------------------
  kafka-init-topics:
    image: confluentinc/cp-kafka:7.6.1
    container_name: scvri_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Creating SCVRI Kafka topics...'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic supplier.events --partitions 6 --replication-factor 1 --config retention.ms=604800000
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic supplier.events.dlq --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic purchase-order.events --partitions 6 --replication-factor 1 --config retention.ms=604800000
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic purchase-order.events.dlq --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic shipment.events --partitions 6 --replication-factor 1 --config retention.ms=604800000
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic shipment.events.dlq --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic iot.telemetry --partitions 12 --replication-factor 1 --config retention.ms=259200000
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic iot.telemetry.dlq --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic risk.score.computed --partitions 6 --replication-factor 1 --config retention.ms=604800000
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic risk.score.computed.dlq --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic alert.triggered --partitions 6 --replication-factor 1 --config retention.ms=604800000
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic alert.triggered.dlq --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic notification.commands --partitions 3 --replication-factor 1 --config retention.ms=604800000
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic notification.commands.dlq --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic audit.events --partitions 6 --replication-factor 1 --config retention.ms=2592000000
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic audit.events.dlq --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic erp.integration.inbound --partitions 3 --replication-factor 1 --config retention.ms=604800000
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic erp.integration.inbound.dlq --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic external.risk.feeds --partitions 3 --replication-factor 1 --config retention.ms=604800000
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic external.risk.feeds.dlq --partitions 1 --replication-factor 1
      echo 'Topics created.'
      "
    networks:
      - scvri_net

  # ----------------------------------------------------------
  # Kafka UI
  # ----------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: scvri_kafka_ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: scvri-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8080:8080"
    networks:
      - scvri_net

  # ----------------------------------------------------------
  # ClickHouse 24.3 (analytics queries)
  # ----------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: scvri_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: scvri_analytics
      CLICKHOUSE_USER: scvri
      CLICKHOUSE_PASSWORD: clickhouse_dev_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP interface
      - "9009:9000"   # Native TCP interface (9000 clashes with MinIO)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_log:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - scvri_net
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ----------------------------------------------------------
  # MinIO — S3-compatible object storage for supplier docs dev
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: scvri_minio
    restart: unless-stopped
    command: server /data --console-address ":9002"
    environment:
      MINIO_ROOT_USER: scvri_minio
      MINIO_ROOT_PASSWORD: minio_dev_password
    ports:
      - "9001:9000"   # S3 API
      - "9002:9002"   # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scvri_net

  # ----------------------------------------------------------
  # MinIO bucket initialiser (one-shot)
  # ----------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: scvri_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      mc alias set local http://minio:9000 scvri_minio minio_dev_password
      mc mb --ignore-existing local/scvri-supplier-documents-dev
      mc mb --ignore-existing local/scvri-exports-dev
      mc mb --ignore-existing local/scvri-ml-artifacts-dev
      mc anonymous set none local/scvri-supplier-documents-dev
      mc anonymous set none local/scvri-exports-dev
      echo 'MinIO buckets initialised.'
      "
    networks:
      - scvri_net

  # ----------------------------------------------------------
  # Mailhog — Catch-all SMTP server for dev email testing
  # ----------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: scvri_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - scvri_net

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:
    name: scvri_postgres_data
  redis_data:
    name: scvri_redis_data
  zookeeper_data:
    name: scvri_zookeeper_data
  zookeeper_log:
    name: scvri_zookeeper_log
  kafka_data:
    name: scvri_kafka_data
  clickhouse_data:
    name: scvri_clickhouse_data
  clickhouse_log:
    name: scvri_clickhouse_log
  minio_data:
    name: scvri_minio_data

# ============================================================
# Networks
# ============================================================
networks:
  scvri_net:
    name: scvri_dev_network
    driver: bridge
