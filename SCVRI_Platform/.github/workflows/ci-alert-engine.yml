name: CI — Alert Engine

on:
  push:
    branches: [main, develop]
    paths:
      - "services/alert-engine/**"
      - "shared/**"
      - ".github/workflows/ci-alert-engine.yml"
      - ".github/workflows/_reusable-service-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/alert-engine/**"
      - "shared/**"
      - ".github/workflows/ci-alert-engine.yml"
      - ".github/workflows/_reusable-service-ci.yml"

concurrency:
  group: ci-alert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_reusable-service-ci.yml
    with:
      service-name: alert-engine
      service-path: services/alert-engine
      image-name: ghcr.io/scvri/alert-engine
      push-image: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
