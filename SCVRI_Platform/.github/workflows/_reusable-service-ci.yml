# ─────────────────────────────────────────────────────────────────────────────
# Reusable CI workflow — called by each per-service workflow.
# Runs: lint (ruff) → type-check (mypy) → test (pytest) → docker build+push
# ─────────────────────────────────────────────────────────────────────────────
name: _Reusable Service CI

on:
  workflow_call:
    inputs:
      service-name:
        description: "Short service name (e.g. iam, supplier-management)"
        required: true
        type: string
      service-path:
        description: "Relative path to the service directory (e.g. services/iam)"
        required: true
        type: string
      image-name:
        description: "Full image name without tag (e.g. ghcr.io/scvri/iam)"
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: "3.12"
      push-image:
        description: "Whether to push the Docker image (true on main branch only)"
        required: false
        type: boolean
        default: false
    secrets:
      GHCR_TOKEN:
        required: true

jobs:
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service-path }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install shared library
        run: pip install ../../../shared  # relative to service-path

      - name: Install service dev dependencies
        run: |
          pip install poetry
          poetry export -f requirements.txt --with dev --without-hashes -o /tmp/reqs.txt
          pip install -r /tmp/reqs.txt

      - name: ruff — lint
        run: ruff check src/ tests/

      - name: ruff — format check
        run: ruff format --check src/ tests/

      - name: mypy — type-check
        run: mypy src/

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ${{ inputs.service-path }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scvri_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: scvri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scvri_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install shared library
        run: pip install ../../../shared

      - name: Install service dependencies
        run: |
          pip install poetry
          poetry export -f requirements.txt --with dev --without-hashes -o /tmp/reqs.txt
          pip install -r /tmp/reqs.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://scvri_test:test_password@localhost:5432/scvri_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-not-for-production
          KAFKA_BOOTSTRAP_SERVERS: ""   # mocked in tests
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v \
            --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.service-name }}-${{ github.run_id }}
          path: ${{ inputs.service-path }}/coverage.xml
          retention-days: 7

  build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.service-path }}/Dockerfile
          push: ${{ inputs.push-image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.service-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service-name }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

      - name: Output image digest
        run: |
          echo "Image digest: ${{ steps.build-push.outputs.digest }}"
          echo "IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_STEP_SUMMARY
