name: CI — Risk Intelligence

on:
  push:
    branches: [main, develop]
    paths:
      - "services/risk-intelligence/**"
      - "shared/**"
      - ".github/workflows/ci-risk-intelligence.yml"
      - ".github/workflows/_reusable-service-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/risk-intelligence/**"
      - "shared/**"
      - ".github/workflows/ci-risk-intelligence.yml"
      - ".github/workflows/_reusable-service-ci.yml"

concurrency:
  group: ci-risk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_reusable-service-ci.yml
    with:
      service-name: risk-intelligence
      service-path: services/risk-intelligence
      image-name: ghcr.io/scvri/risk-intelligence
      push-image: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
