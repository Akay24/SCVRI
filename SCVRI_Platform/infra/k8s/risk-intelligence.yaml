# ─────────────────────────────────────────────────────────────────────────────
# Risk Intelligence Engine — port 8002
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-intelligence
  namespace: scvri
  labels:
    app.kubernetes.io/name: risk-intelligence
    app.kubernetes.io/part-of: scvri-platform
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: risk-intelligence
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risk-intelligence
        app.kubernetes.io/part-of: scvri-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: scvri-risk-intelligence
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: risk-intelligence
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      containers:
        - name: risk-intelligence
          image: ghcr.io/scvri/risk-intelligence:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
              name: http
          envFrom:
            - configMapRef:
                name: scvri-common
            - configMapRef:
                name: scvri-risk-config
            - secretRef:
                name: scvri-postgres-secret
            - secretRef:
                name: scvri-redis-secret
          env:
            - name: IAM_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: scvri-iam-keys
                  key: IAM_PUBLIC_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: risk-intelligence
  namespace: scvri
  labels:
    app.kubernetes.io/name: risk-intelligence
    app.kubernetes.io/part-of: scvri-platform
spec:
  selector:
    app.kubernetes.io/name: risk-intelligence
  ports:
    - port: 8002
      targetPort: 8002
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: risk-intelligence
  namespace: scvri
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: risk-intelligence
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scvri-risk-intelligence
  namespace: scvri
