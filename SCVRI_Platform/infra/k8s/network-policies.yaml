# Alert Engine egress: internal infra + external SMTP/Slack/PagerDuty (port 443 + 587)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alert-egress
  namespace: scvri
spec:
  podSelector:
    matchLabels:
      app: alert-engine
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgresql
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 9092
    - to:
        - podSelector:
            matchLabels:
              app: iam
      ports:
        - port: 8000
    # External: SMTP (587) + HTTPS for Slack & PagerDuty (443)
    - ports:
        - port: 587
          protocol: TCP
        - port: 443
          protocol: TCP

