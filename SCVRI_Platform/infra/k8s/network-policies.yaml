# ─────────────────────────────────────────────────────────────────────────────
# Network Policies
# Strategy: default deny-all ingress+egress on the scvri namespace,
# then explicitly open only required paths (least privilege).
# ─────────────────────────────────────────────────────────────────────────────

# ── 1. Default deny-all for the entire scvri namespace ───────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: scvri
  labels:
    app.kubernetes.io/part-of: scvri-platform
spec:
  podSelector: {}          # applies to all pods in namespace
  policyTypes:
    - Ingress
    - Egress

---
# ── 2. Allow DNS egress (kube-dns) — required by every pod ───────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: scvri
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
# ── 3. PostgreSQL ─────────────────────────────────────────────────────────────
# Ingress: accept from all SCVRI application services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgresql-ingress
  namespace: scvri
spec:
  podSelector:
    matchLabels:
      app: postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/part-of
                operator: In
                values:
                  - scvri-platform
      ports:
        - port: 5432
          protocol: TCP

---
# ── 4. Redis ──────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-ingress
  namespace: scvri
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/part-of
                operator: In
                values:
                  - scvri-platform
      ports:
        - port: 6379
          protocol: TCP

---
# ── 5. Kafka ──────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-ingress
  namespace: scvri
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/part-of
                operator: In
                values:
                  - scvri-platform
      ports:
        - port: 9092
          protocol: TCP
        - port: 29093
          protocol: TCP

---
# ── 6. IAM Service ───────────────────────────────────────────────────────────
# Ingress: from ingress-nginx + from all internal services (JWKS fetch)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-iam-ingress
  namespace: scvri
spec:
  podSelector:
    matchLabels:
      app: iam
  policyTypes:
    - Ingress
  ingress:
    # From NGINX ingress controller (in ingress-nginx namespace)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
          protocol: TCP
    # From internal services fetching JWKS
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/part-of
                operator: In
                values:
                  - scvri-platform
      ports:
        - port: 8000
          protocol: TCP

---
# IAM Egress: postgres + redis + kafka + DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-iam-egress
  namespace: scvri
spec:
  podSelector:
    matchLabels:
      app: iam
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgresql
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 9092

---
