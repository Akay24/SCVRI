# ─────────────────────────────────────────────────────────────────────────────
# Alert Engine — port 8004
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-engine
  namespace: scvri
  labels:
    app.kubernetes.io/name: alert-engine
    app.kubernetes.io/part-of: scvri-platform
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-engine
        app.kubernetes.io/part-of: scvri-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: scvri-alert-engine
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: alert-engine
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      containers:
        - name: alert-engine
          image: ghcr.io/scvri/alert-engine:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8004
              name: http
          envFrom:
            - configMapRef:
                name: scvri-common
            - configMapRef:
                name: scvri-alert-config
            - secretRef:
                name: scvri-postgres-secret
            - secretRef:
                name: scvri-redis-secret
            - secretRef:
                name: scvri-alert-secret
          env:
            - name: IAM_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: scvri-iam-keys
                  key: IAM_PUBLIC_KEY
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Celery worker for alert notifications
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-engine-worker
  namespace: scvri
  labels:
    app.kubernetes.io/name: alert-engine-worker
    app.kubernetes.io/part-of: scvri-platform
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-engine-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-engine-worker
        app.kubernetes.io/part-of: scvri-platform
    spec:
      serviceAccountName: scvri-alert-engine
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: alert-engine-worker
          image: ghcr.io/scvri/alert-engine:1.0.0
          imagePullPolicy: Always
          command:
            - celery
            - --app=alert_engine.workers.celery_app
            - worker
            - --loglevel=INFO
            - --concurrency=4
            - -Q
            - alerts,notifications,default
          envFrom:
            - configMapRef:
                name: scvri-common
            - configMapRef:
                name: scvri-alert-config
            - secretRef:
                name: scvri-postgres-secret
            - secretRef:
                name: scvri-redis-secret
            - secretRef:
                name: scvri-alert-secret
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Celery Beat scheduler
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-engine-beat
  namespace: scvri
  labels:
    app.kubernetes.io/name: alert-engine-beat
    app.kubernetes.io/part-of: scvri-platform
spec:
  replicas: 1   # Beat must be a singleton
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-engine-beat
  strategy:
    type: Recreate   # Recreate ensures single instance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-engine-beat
        app.kubernetes.io/part-of: scvri-platform
    spec:
      serviceAccountName: scvri-alert-engine
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: alert-engine-beat
          image: ghcr.io/scvri/alert-engine:1.0.0
          command:
            - celery
            - --app=alert_engine.workers.celery_app
            - beat
            - --loglevel=INFO
            - --scheduler=celery.beat:PersistentScheduler
            - -s
            - /tmp/celerybeat-schedule
          envFrom:
            - configMapRef:
                name: scvri-common
            - configMapRef:
                name: scvri-alert-config
            - secretRef:
                name: scvri-postgres-secret
            - secretRef:
                name: scvri-redis-secret
            - secretRef:
                name: scvri-alert-secret
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-engine
  namespace: scvri
  labels:
    app.kubernetes.io/name: alert-engine
    app.kubernetes.io/part-of: scvri-platform
spec:
  selector:
    app.kubernetes.io/name: alert-engine
  ports:
    - port: 8004
      targetPort: 8004
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alert-engine
  namespace: scvri
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alert-engine
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alert-engine-worker
  namespace: scvri
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alert-engine-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scvri-alert-engine
  namespace: scvri
