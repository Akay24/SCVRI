# ─────────────────────────────────────────────────────────────────────────────
# RBAC — Roles and RoleBindings for SCVRI service accounts
# Principle of least privilege: each service reads only the Secrets/ConfigMaps
# it actually needs; no service has write access to any namespace resource.
# ─────────────────────────────────────────────────────────────────────────────

# ════════════════════════════════════════════════════════════════════════════
# SHARED ROLES
# ════════════════════════════════════════════════════════════════════════════

# Role: read scvri-common ConfigMap (shared by all services)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scvri-common-configmap-reader
  namespace: scvri
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["scvri-common"]
    verbs: ["get", "list", "watch"]

---
# ════════════════════════════════════════════════════════════════════════════
# IAM SERVICE
# ════════════════════════════════════════════════════════════════════════════
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scvri-iam-role
  namespace: scvri
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - scvri-common
      - scvri-iam-config
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - scvri-postgres-secret
      - scvri-redis-secret
      - scvri-iam-keys
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scvri-iam-rolebinding
  namespace: scvri
subjects:
  - kind: ServiceAccount
    name: scvri-iam
    namespace: scvri
roleRef:
  kind: Role
  name: scvri-iam-role
  apiGroup: rbac.authorization.k8s.io

---
