# ─────────────────────────────────────────────────────────────────────────────
# PodDisruptionBudgets — ensure minimum availability during voluntary disruptions
# (node drains, cluster upgrades, etc.)
# All HPAs have minReplicas=2, so PDB maxUnavailable=1 is safe.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-iam
  namespace: scvri
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: iam

