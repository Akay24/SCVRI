# ─────────────────────────────────────────────────────────────────────────────
# SCVRI Platform — Kubernetes Secrets (TEMPLATES ONLY)
#
# ⚠  DO NOT commit real credentials.
#    In production use one of:
#      - Bitnami Sealed Secrets  (kubeseal)
#      - External Secrets Operator (AWS Secrets Manager / Vault)
#      - SOPS + age encryption
#
# All values below are base64-encoded placeholders.
# Replace with:  echo -n "your-value" | base64
# ─────────────────────────────────────────────────────────────────────────────

