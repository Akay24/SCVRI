# ── IAM Service — RSA key pair ────────────────────────────────────────────────
# Generate with:
#   openssl genrsa -out iam_private.pem 2048
#   openssl rsa -in iam_private.pem -pubout -out iam_public.pem
#   cat iam_private.pem | base64 -w0  → IAM_PRIVATE_KEY
#   cat iam_public.pem  | base64 -w0  → IAM_PUBLIC_KEY
apiVersion: v1
kind: Secret
metadata:
  name: scvri-iam-keys
  namespace: scvri
  labels:
    app.kubernetes.io/name: iam
    app.kubernetes.io/part-of: scvri-platform
type: Opaque
data:
  IAM_PRIVATE_KEY: UEFTU1dPUkQtUExBQ0VIT0xERVI=   # base64(PEM-encoded RSA private key)
  IAM_PUBLIC_KEY:  UEFTU1dPUkQtUExBQ0VIT0xERVI=   # base64(PEM-encoded RSA public key)
---
# ── Integration Layer — shared HMAC signing key ───────────────────────────────
