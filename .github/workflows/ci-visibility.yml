name: CI — Visibility Service

on:
  push:
    branches: [main, develop]
    paths:
      - "services/visibility/**"
      - "shared/**"
      - ".github/workflows/ci-visibility.yml"
      - ".github/workflows/_reusable-service-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/visibility/**"
      - "shared/**"
      - ".github/workflows/ci-visibility.yml"
      - ".github/workflows/_reusable-service-ci.yml"

concurrency:
  group: ci-visibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_reusable-service-ci.yml
    with:
      service-name: visibility
      service-path: services/visibility
      image-name: ghcr.io/scvri/visibility
      push-image: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
