name: CI — Supplier Management

on:
  push:
    branches: [main, develop]
    paths:
      - "services/supplier-management/**"
      - "shared/**"
      - ".github/workflows/ci-supplier-management.yml"
      - ".github/workflows/_reusable-service-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/supplier-management/**"
      - "shared/**"
      - ".github/workflows/ci-supplier-management.yml"
      - ".github/workflows/_reusable-service-ci.yml"

concurrency:
  group: ci-supplier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_reusable-service-ci.yml
    with:
      service-name: supplier-management
      service-path: services/supplier-management
      image-name: ghcr.io/scvri/supplier-management
      push-image: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
