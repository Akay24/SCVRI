name: CI — IAM Service

on:
  push:
    branches: [main, develop]
    paths:
      - "services/iam/**"
      - "shared/**"
      - ".github/workflows/ci-iam.yml"
      - ".github/workflows/_reusable-service-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/iam/**"
      - "shared/**"
      - ".github/workflows/ci-iam.yml"
      - ".github/workflows/_reusable-service-ci.yml"

concurrency:
  group: ci-iam-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_reusable-service-ci.yml
    with:
      service-name: iam
      service-path: services/iam
      image-name: ghcr.io/scvri/iam
      push-image: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
