name: Security Scanning

on:
  schedule:
    - cron: "0 3 * * 1"   # Every Monday at 03:00 UTC
  push:
    branches: [main]
    paths:
      - "**/Dockerfile"
      - "**/pyproject.toml"
      - "**/poetry.lock"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ── Trivy: scan all service Docker images for CVEs ───────────────────────────
  trivy-image-scan:
    name: Trivy — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - iam
          - supplier-management
          - risk-intelligence
          - visibility
          - alert-engine
          - integration

    steps:
      - uses: actions/checkout@v6

      - name: Build image locally for scanning
        run: |
          docker build \
            -t ghcr.io/scvri/${{ matrix.service }}:scan \
            -f services/${{ matrix.service }}/Dockerfile \
            .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/scvri/${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"          # fail on CRITICAL/HIGH
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  # ── CodeQL: static analysis of Python source ─────────────────────────────────
  codeql:
    name: CodeQL Python Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-python

  # ── pip-audit: dependency vulnerability check ────────────────────────────────
  pip-audit:
    name: pip-audit — ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - shared
          - services/iam
          - services/supplier-management
          - services/risk-intelligence
          - services/visibility
          - services/alert-engine
          - services/integration

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit + export deps
        working-directory: ${{ matrix.target }}
        run: |
          pip install poetry pip-audit
          poetry export -f requirements.txt --without-hashes -o /tmp/requirements-audit.txt

      - name: Run pip-audit
        run: |
          pip-audit -r /tmp/requirements-audit.txt \
            --ignore-vuln GHSA-xxxx-xxxx-xxxx \
            --format json \
            --output pip-audit-${{ matrix.target == 'shared' && 'shared' || matrix.target }}.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-${{ github.run_id }}-${{ strategy.job-index }}
          path: "*.json"
          retention-days: 30
