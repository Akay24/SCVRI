[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alert-engine"
version = "0.1.0"
description = "SCVRI Alert Engine – rule evaluation, notification dispatch, alert lifecycle management"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "celery[redis]==5.4.0",
    "aiokafka==0.11.0",
    "httpx==0.28.1",         # webhook dispatch
    "aiosmtplib==3.0.2",     # async SMTP for email notifications
    "jinja2==3.1.4",         # notification templates
    "tenacity==9.0.0",
    "structlog==24.4.0",
    "scvri-shared @ file://../../shared",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==7.0.0",
    "httpx==0.28.1",
    "freezegun==1.5.1",
    "respx==0.21.1",          # mock httpx for webhook tests
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/alert_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
