##############################################################################
# MODULE 13 — SECURITY HARDENING + STRIDE THREAT MODEL
# Scope: All 8 SCVRI microservices + infrastructure
# Framework: STRIDE (Spoofing, Tampering, Repudiation, Info Disclosure, DoS, Elevation)
# Version: 1.0.0
##############################################################################

security_posture:
  compliance_targets: [SOC 2 Type II, ISO 27001, GDPR, CCPA]
  zero_trust_model: true
  service_mesh_mtls: STRICT (Istio)
  encryption_in_transit: TLS 1.3 minimum (NFR-SEC-001)
  encryption_at_rest: AES-256 (NFR-SEC-002)

# ==============================================================================
# DATA FLOW DIAGRAM — TRUST BOUNDARIES
# ==============================================================================
trust_boundaries:
  - boundary: Internet → Kong API Gateway
    protection: [WAF (AWS WAF v2), TLS 1.3, DDoS (AWS Shield Standard), Bot detection]
    threat_level: untrusted

  - boundary: Kong API Gateway → Microservices (scvri-prod namespace)
    protection: [JWT validation in Kong, Istio mTLS STRICT, NetworkPolicy]
    threat_level: trust_after_jwt_validation

  - boundary: Microservices ↔ Microservices
    protection: [Istio mTLS STRICT, NetworkPolicy default-deny, RBAC service accounts]
    threat_level: trusted_internal (verified identity via SPIFFE/SPIRE)

  - boundary: Microservices → Data Stores (RDS, Redis, MSK, S3)
    protection: [VPC Security Groups (least privilege), KMS encryption, IAM roles (IRSA), no public access]
    threat_level: trusted_internal

  - boundary: Supplier Portal → API Gateway
    protection: [Scoped JWT (supplier_portal token), TLS 1.3, Rate limiting 200/min]
    threat_level: untrusted_external

  - boundary: ERP Connectors → External ERP systems
    protection: [TLS 1.3, OAuth 2.0 client credentials, IP allowlisting, Secrets Manager]
    threat_level: semi_trusted_b2b

# ==============================================================================
# STRIDE THREAT ANALYSIS
# ==============================================================================
stride_threats:

  # S — SPOOFING
  spoofing_threats:
    - threat_id: STRIDE-S-001
      component: API endpoint consumers
      threat: "Attacker forges JWT token to access another tenant's data"
      likelihood: medium
      impact: critical
      mitigation:
        - RS256 JWT with 15-min expiry + jti revocation list in Redis
        - PostgreSQL RLS enforces tenant_id on every query regardless of JWT
        - Kong validates JWT signature + exp + iss + aud before routing
      residual_risk: low
      testing: "JWT signature bypass test (OWASP ZAP auth + Burp alg:none test)"

    - threat_id: STRIDE-S-002
      component: SSO federation
      threat: "SAML assertion forgery bypasses authentication"
      likelihood: low
      impact: critical
      mitigation:
        - Require signed + encrypted SAML assertions (SHA-256 signature)
        - Validate AudienceRestriction against sp_entity_id
        - Check NotBefore + NotOnOrAfter timestamps with 30s clock skew tolerance
        - Use python3-saml with strict validation mode
      residual_risk: very_low

    - threat_id: STRIDE-S-003
      component: Supplier portal
      threat: "Supplier obtains another supplier's portal token via guessable ID"
      likelihood: low
      impact: high
      mitigation:
        - Portal tokens are 256-bit cryptographically random (secrets.token_hex(32))
        - Token bound to specific supplier_id in Redis
        - Single-use for sensitive actions; 48h TTL for read access
        - RLS policy supplier_portal_isolation provides second defense layer
      residual_risk: very_low

    - threat_id: STRIDE-S-004
      component: Webhook consumers
      threat: "Attacker sends forged webhook payload pretending to be SCVRI"
      likelihood: medium
      impact: medium
      mitigation:
        - HMAC-SHA256 signature on all webhook payloads (X-SCVRI-Signature header)
        - Customer must verify signature on their end (documented in API guides)
        - Delivery-ID included for idempotency + replay detection
      residual_risk: low

  # T — TAMPERING
  tampering_threats:
    - threat_id: STRIDE-T-001
      component: Audit log
      threat: "Privileged user or attacker modifies audit records to hide actions"
      likelihood: low
      impact: critical
      mitigation:
        - PostgreSQL trigger prevent_audit_modification() blocks UPDATE/DELETE on audit.audit_log
        - S3 WORM bucket (Object Lock COMPLIANCE mode) archival via Kafka Connect sink
        - Separate KMS key for audit archive S3 bucket
        - Read-only access: compliance_officer + it_administrator (SELECT only)
      residual_risk: very_low
      compliance: SOC 2 CC7.2, ISO 27001 A.12.4

    - threat_id: STRIDE-T-002
      component: ML model artifacts
      threat: "Model artifact in S3 replaced with adversarially manipulated model"
      likelihood: low
      impact: high
      mitigation:
        - S3 bucket versioning + MFA-delete for scvri-ml-artifacts-prod
        - Model artifacts signed with Cosign (SHA-256 digest stored in MLflow)
        - Deployment pipeline verifies Cosign signature before loading model
        - IAM IRSA: only SageMaker Training Job role + ML deployment role can write
      residual_risk: very_low

    - threat_id: STRIDE-T-003
      component: Kafka messages
      threat: "Attacker injects malicious events into Kafka topics"
      likelihood: low
      impact: high
      mitigation:
        - MSK SASL/SCRAM-SHA-512 authentication + ACLs (topic-level READ/WRITE per service account)
        - MSK TLS in-transit encryption
        - Kafka consumer validates EventEnvelope schema (Avro/JSON Schema registry)
        - DLQ routes malformed messages for investigation
      residual_risk: very_low

    - threat_id: STRIDE-T-004
      component: Terraform state
      threat: "Infrastructure state file tampered to add unauthorized resources"
      likelihood: very_low
      impact: critical
      mitigation:
        - S3 state bucket: SSE-KMS + versioning + MFA-delete
        - DynamoDB lock prevents concurrent applies
        - Terraform Cloud: state protected by API token + audit log
        - GitHub branch protection: 2 approvers required for infra PRs
      residual_risk: very_low

  # R — REPUDIATION
  repudiation_threats:
    - threat_id: STRIDE-R-001
      component: All platform actions
      threat: "User denies performing a critical action (risk override, user deletion, rule change)"
      likelihood: medium
      impact: medium
      mitigation:
        - audit.audit_log captures actor_id, action, resource, ip_address, user_agent, outcome
        - Immutable log (tamper-proof trigger + WORM S3)
        - JWT jti claim correlates each API call to a specific token issuance
        - MFA re-authentication required for risk score overrides (MFA token stored in audit)
      residual_risk: very_low

    - threat_id: STRIDE-R-002
      component: GDPR erasure requests
      threat: "Organisation denies having processed or received a data erasure request"
      likelihood: medium
      impact: high
      mitigation:
        - gdpr.erasure_requests table with immutable timestamps
        - Erasure request acknowledgment email sent to requester (AWS SES with archived copy)
        - S3 WORM archive of all erasure request records
      residual_risk: very_low

  # I — INFORMATION DISCLOSURE
  information_disclosure_threats:
    - threat_id: STRIDE-I-001
      component: Multi-tenant database
      threat: "Tenant A queries data belonging to Tenant B via SQL injection or misconfiguration"
      likelihood: medium
      impact: critical
      mitigation:
        - PostgreSQL RLS enforces tenant_id = current_setting('app.current_tenant_id') on every table
        - All queries use parameterized statements (SQLAlchemy ORM; no raw f-string SQL)
        - Citus distributes data by tenant_id; cross-shard queries require explicit tenant_id parameter
        - Connection pool: SET LOCAL app.current_tenant_id = :tenant_id on every connection acquire
        - Integration tests: verify Tenant A token cannot access Tenant B resources (200+ test cases)
      residual_risk: very_low
      test_ref: tests/security/test_tenant_isolation.py

    - threat_id: STRIDE-I-002
      component: API responses
      threat: "API leaks PII (contact emails, phone numbers) to under-privileged users"
      likelihood: medium
      impact: high
      mitigation:
        - Response serializer applies role-based field masking (pydantic with field-level permission check)
        - PII fields encrypted at rest; decryption only permitted for procurement_officer+ roles
        - Supplier portal responses: only own-supplier data, PII fields masked for portal role
        - API fuzz test with low-privilege tokens checks for PII field leakage
      residual_risk: low

    - threat_id: STRIDE-I-003
      component: Log files
      threat: "PII or secrets logged in application logs, accessible via Kibana"
      likelihood: high (common mistake)
      impact: high
      mitigation:
        - Mandatory log sanitization middleware: masks email, phone, token, password, key fields
        - Structured logging (JSON) with explicit field allowlist
        - Kibana access restricted by IAM role (compliance_officer, it_administrator)
        - Bandit CI scan flags Python logging of sensitive variables
        - PII fields annotated with @sensitive decorator → automatically redacted
      residual_risk: low

    - threat_id: STRIDE-I-004
      component: S3 buckets
      threat: "Misconfigured S3 bucket exposes supplier documents publicly"
      likelihood: medium
      impact: critical
      mitigation:
        - All S3 buckets: BlockPublicACLs + BlockPublicPolicy + RestrictPublicBuckets + IgnorePublicACLs
        - AWS Config rule s3-bucket-public-read-prohibited (auto-remediate)
        - S3 pre-signed URLs expire in 900s; no public endpoint
        - AWS Macie scan weekly for PII in S3
      residual_risk: very_low

    - threat_id: STRIDE-I-005
      component: Error messages
      threat: "Verbose error messages reveal stack traces, DB schema, or internal paths"
      likelihood: high
      impact: medium
      mitigation:
        - Production FastAPI: debug=False; custom exception handlers return {error_code, message} only
        - Internal errors (500) return generic "Internal server error" with request_id (traceable in Jaeger)
        - Stack traces only in internal logs (log level ERROR, never in HTTP response body)
      residual_risk: very_low

  # D — DENIAL OF SERVICE
  dos_threats:
    - threat_id: STRIDE-D-001
      component: Kong API Gateway
      threat: "Volumetric DDoS attack overwhelms API gateway"
      likelihood: medium
      impact: high
      mitigation:
        - AWS Shield Standard (always on L3/L4 DDoS protection)
        - AWS WAF rate-based rule: 10,000 req/5min per IP → auto-block 60min
        - Kong rate limiting plugin (per-tenant + per-IP)
        - CloudFront CDN for static assets (off-loads traffic)
      residual_risk: low

    - threat_id: STRIDE-D-002
      component: ML scoring pipeline
      threat: "Tenant triggers mass score refresh for 10k suppliers causing OOM/CPU exhaustion"
      likelihood: medium
      impact: medium
      mitigation:
        - Scoring pipeline rate limit: max 1 full-tenant rescore per hour per tenant
        - Batch size: 500 suppliers per Celery task
        - Worker auto-scales 4→24 (HPA); other tenants not blocked
        - Resource limits + pod disruption budgets prevent cross-tenant resource starvation
      residual_risk: low

    - threat_id: STRIDE-D-003
      component: Kafka consumer lag
      threat: "Malicious ERP connector floods Kafka ingestion topics with invalid events"
      likelihood: low
      impact: medium
      mitigation:
        - MSK topic-level producer rate limit (quota.producer.byte-rate per client-id)
        - Schema validation at consumer: malformed events → DLQ (not processed)
        - Alert on abnormal producer throughput (> 3σ above baseline)
      residual_risk: very_low

    - threat_id: STRIDE-D-004
      component: Ad-hoc query builder
      threat: "User runs unbounded query scanning 500M ClickHouse rows causing cluster slowdown"
      likelihood: medium
      impact: medium
      mitigation:
        - max_execution_time: 30s (ClickHouse cluster setting)
        - max_rows_to_read: 100_000_000
        - User-facing limit: 50,000 result rows + 10MB
        - Query cost estimation before execution (EXPLAIN); reject if estimated rows > 500M
      residual_risk: low

  # E — ELEVATION OF PRIVILEGE
  elevation_threats:
    - threat_id: STRIDE-E-001
      component: Kubernetes pods
      threat: "Compromised pod escalates to node/cluster admin via privileged container or host path"
      likelihood: low
      impact: critical
      mitigation:
        - OPA/Gatekeeper: DisallowPrivilegedContainers, RequireNonRootUser, RequireReadOnlyRootFilesystem
        - seccompProfile: RuntimeDefault on all pods
        - capabilities: drop: [ALL]; add only if specifically needed
        - No hostPID, hostIPC, hostNetwork in production workloads
        - Pod identity via IRSA (IAM Roles for Service Accounts) — no instance metadata access
        - EKS node groups: IMDSv2 required (hop limit=1 prevents SSRF reaching metadata)
      residual_risk: very_low
      compliance: SOC 2 CC6.6, CIS Kubernetes Benchmark

    - threat_id: STRIDE-E-002
      component: Supplier portal user
      threat: "Portal user crafts request to access platform user data or other tenant"
      likelihood: medium
      impact: high
      mitigation:
        - user_type=supplier_portal claim in JWT
        - Middleware rejects all non-own-supplier endpoints for portal tokens
        - RLS policy supplier_portal_isolation (second layer)
        - Supplier portal tokens cannot call /admin/* endpoints (Kong route restriction)
      residual_risk: very_low

    - threat_id: STRIDE-E-003
      component: IAM roles
      threat: "Developer or CI role gains access to production secrets via overly permissive IAM"
      likelihood: medium
      impact: critical
      mitigation:
        - Least-privilege IAM roles per service (IRSA), no wildcard resource ARNs
        - Secrets Manager: each service can only read its own secret paths
        - No IAM user keys in production; only IRSA for pods, OIDC for GitHub Actions
        - Quarterly IAM access review (automated: AWS IAM Access Analyzer)
        - AWS CloudTrail + Security Hub alerts on privilege escalation attempts
      residual_risk: low

# ==============================================================================
# WAF RULES (AWS WAF v2)
# ==============================================================================
waf_rules:
  - name: AWSManagedRulesCommonRuleSet
    priority: 1
    action: block
    excludes: []  # Review before adding

  - name: AWSManagedRulesSQLiRuleSet
    priority: 2
    action: block

  - name: AWSManagedRulesKnownBadInputsRuleSet
    priority: 3
    action: block

  - name: AWSManagedRulesAmazonIpReputationList
    priority: 4
    action: block

  - name: RateLimitRule
    priority: 10
    action: block
    statement:
      rate_based_statement:
        limit: 10000
        aggregate_key_type: IP
        evaluation_window: 300  # 5 minutes

  - name: GeoBlockHighRiskCountries
    priority: 20
    action: count   # count first; block after baseline established
    statement:
      geo_match: [KP, IR, SY]   # OFAC-sanctioned; adjust per legal review

# ==============================================================================
# SECRETS MANAGEMENT
# ==============================================================================
secrets_management:
  platform: AWS Secrets Manager
  k8s_integration: "Secrets Store CSI Driver (secrets-store.csi.k8s.io) — mounts secrets as files/env vars; never stored in K8s etcd"
  rotation:
    database_credentials: automatic_90_days (RDS Lambda rotation)
    api_keys: manual + 365-day hard expiry
    jwt_signing_key: automatic_90_days (KMS key rotation)
    external_feed_api_keys: manual + 365-day hard expiry + rotation alert at 330 days
  access_logging: All secret reads logged to CloudTrail + Security Hub

# ==============================================================================
# PENETRATION TESTING SCHEDULE
# ==============================================================================
pentest_schedule:
  external_pentest:
    frequency: annual
    scope: full API + infrastructure (black-box)
    vendor: third-party CREST-accredited firm
    remediation_sla:
      critical: 72h
      high: 14d
      medium: 90d

  internal_redteam:
    frequency: semi-annual
    scope: tenant isolation, RBAC bypass, Kafka ACL bypass
    team: internal security + SRE

  bug_bounty:
    platform: HackerOne (invite-only initially)
    scope: API + portal
    rewards: critical=$5000, high=$2000, medium=$500
